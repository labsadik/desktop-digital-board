name: Build Note Replace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- --run
      - run: npm run build

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist -- --win nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: note-replace-windows
          path: dist/*.exe
          if-no-files-found: error

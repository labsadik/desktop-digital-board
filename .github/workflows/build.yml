name: Build Note Replace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- --run
      - run: npm run build

  windows-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist -- --win nsis
      - name: Smoke test packaged Electron app
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\Note Replace.exe'
          if (-not (Test-Path $exe)) { throw "Packaged Electron executable not found: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Electron exited during smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: note-replace-windows
          path: release/*.exe
          if-no-files-found: error

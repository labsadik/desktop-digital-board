appId: com.notereplace.desktop
productName: Note Replace
compression: store
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/logo.png
    to: assets/logo.png
win:
  target:
    - nsis
  icon: logo.png
  forceCodeSigning: false
mac:
  target:
    - dmg
  icon: logo.png
linux:
  target:
    - AppImage
  icon: logo.png

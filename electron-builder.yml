appId: com.notereplace.desktop
productName: Note Replace
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/logo.png
    to: assets/logo.png
win:
  target: nsis
  icon: assets/logo.png
mac:
  target: dmg
  icon: assets/logo.png
linux:
  target: AppImage
  icon: assets/logo.png

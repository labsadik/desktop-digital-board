appId: com.notereplace.desktop
productName: Note Replace
artifactName: Note-Replace-${version}-${os}-${arch}.${ext}
description: Professional desktop PDF editor and annotation workspace built with Electron and React
author: Sadik Laskar
copyright: Copyright © 2026 Sadik Laskar. All Rights Reserved.
compression: maximum
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/logo.png
    to: assets/logo.png
win:
  target:
    - nsis
  icon: logo.png
  forceCodeSigning: false
  signAndEditExecutable: true
  legalTrademarks: Note Replace — © 2026 Sadik Laskar
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Note Replace
  menuCategory: Note Replace
  license: license.txt
  runAfterFinish: true
mac:
  target:
    - dmg
  icon: logo.png
linux:
  target:
    - AppImage
  icon: logo.png

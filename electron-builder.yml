appId: com.notereplace.desktop
productName: Note Replace
artifactName: Note-Replace-${version}-${os}-${arch}.${ext}
compression: maximum
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/logo.png
    to: assets/logo.png
win:
  target:
    - nsis
  icon: logo.png
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Note Replace
  menuCategory: Note Replace
  runAfterFinish: true
mac:
  target:
    - dmg
  icon: logo.png
linux:
  target:
    - AppImage
  icon: logo.png
